# Devvit app (devvit/): typecheck, lint, unit tests, build.
name: Devvit CI

on:
  push:
    branches: ['main']
    paths: ['devvit/**', '.github/workflows/devvit-ci.yaml']
  pull_request:
    branches: ['main']
    paths: ['devvit/**', '.github/workflows/devvit-ci.yaml']

permissions:
  contents: read

defaults:
  run:
    working-directory: devvit

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - name: Install Dependencies
        run: npm install --no-fund
      - name: Typecheck
        run: npm run test:types
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
