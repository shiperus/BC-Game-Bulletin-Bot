# Discord bot (bc_bot/): unit tests. No secrets needed -- tests run offline
# against tests/fixtures (RSS article fetches are mocked).
name: Bot CI

on:
  push:
    branches: ['main']
    paths: ['bc_bot/**', 'tests/**', 'requirements.txt', '.github/workflows/bot-ci.yaml']
  pull_request:
    branches: ['main']
    paths: ['bc_bot/**', 'tests/**', 'requirements.txt', '.github/workflows/bot-ci.yaml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Unit Tests
        run: python -m unittest discover -s tests
